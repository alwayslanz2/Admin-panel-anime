<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kelola Anime</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Admin Panel</h1>
            <p>Kelola Anime di <code>all-anime.json</code></p>
            <p class="repo-link">Repository: <a href="https://github.com/alwayslanz2/Streaming" target="_blank">alwayslanz2/Streaming</a></p>
        </div>

        <div class="mode-toggle">
            <button id="listModeBtn" class="mode-btn active">📋 Daftar Anime</button>
            <button id="addModeBtn" class="mode-btn">➕ Tambah Anime</button>
        </div>

        <div id="listMode" class="list-container">
            <div class="search-bar">
                <input type="text" id="searchAnime" placeholder="Cari anime...">
            </div>
            <div id="animeList" class="anime-list-admin">
                <div class="loading">Memuat...</div>
            </div>
        </div>

        <div id="formMode" style="display: none;">
            <div class="form-container">
                <div class="form-header">
                    <h2 id="formTitle">📝 Tambah Anime Baru</h2>
                    <button id="cancelEditBtn" class="btn-secondary" style="display: none;">✖️ Batal Edit</button>
                </div>
                <form id="animeForm">
                    <input type="hidden" id="animeId">
                    
                    <div class="form-section">
                        <h3>📺 Informasi Dasar</h3>
                        <div class="form-group">
                            <label>Judul Anime *</label>
                            <input type="text" id="title" required>
                        </div>
                        <div class="form-group">
                            <label>Cover URL *</label>
                            <input type="url" id="cover" placeholder="https://..." required>
                        </div>
                        <div class="form-group">
                            <label>Sinopsis *</label>
                            <textarea id="synopsis" rows="4" required></textarea>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Genre * (pisah koma)</label>
                                <input type="text" id="genre" placeholder="Action, Drama" required>
                            </div>
                            <div class="form-group">
                                <label>Studio *</label>
                                <input type="text" id="studio" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Rating *</label>
                                <input type="number" id="rating" step="0.01" min="0" max="10" required>
                            </div>
                            <div class="form-group">
                                <label>Views *</label>
                                <input type="text" id="views" placeholder="7,5K" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Latest Episode *</label>
                                <input type="number" id="latestEpisode" min="1" required>
                            </div>
                            <div class="form-group">
                                <label>Upload Date *</label>
                                <input type="date" id="uploadDate" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Schedule Day (kosongkan jika tamat)</label>
                                <select id="scheduleDay">
                                    <option value="">-- Kosongkan (tamat) --</option>
                                    <option value="Senin">Senin</option>
                                    <option value="Selasa">Selasa</option>
                                    <option value="Rabu">Rabu</option>
                                    <option value="Kamis">Kamis</option>
                                    <option value="Jumat">Jumat</option>
                                    <option value="Sabtu">Sabtu</option>
                                    <option value="Minggu">Minggu</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Schedule Status</label>
                                <select id="scheduleStatus">
                                    <option value="">-- Kosongkan (tamat) --</option>
                                    <option value="Sudah Tayang">Sudah Tayang</option>
                                    <option value="Menunggu Update">Menunggu Update</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                <input type="checkbox" id="isTrending" style="width: 20px; height: 20px; margin: 0;">
                                🔥 Masukkan ke Trending Now
                            </label>
                            <small>Centang jika anime ini baru rilis atau sedang trending</small>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3>📺 Daftar Episode</h3>
                        <div id="episodesContainer">
                            <div class="episode-item" data-index="0">
                                <h4>Episode 1</h4>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Judul Episode</label>
                                        <input type="text" class="episode-title" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Video URL</label>
                                        <input type="url" class="episode-url" placeholder="https://..." required>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <button type="button" id="addEpisodeBtn" class="btn-secondary">+ Tambah Episode</button>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="submitBtn" class="btn-primary">✨ Simpan Anime</button>
                        <button type="button" id="previewBtn" class="btn-secondary">👁️ Preview JSON</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="previewModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h3>Preview JSON</h3>
                <pre id="previewJson"></pre>
            </div>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="/js/main.js"></script>
</body>
</html>
